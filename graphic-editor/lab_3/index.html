<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Графічний редактор — варіант 15</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <nav>
      <details>
        <summary>Файл</summary>
        <div class="menu"><button type="button" id="clear">Очистити</button></div>
      </details>
      <details>
        <summary>Об’єкти</summary>
        <div class="menu">
          <label><input type="radio" name="shape" data-shape="point" checked /><span>Крапка</span></label>
          <label><input type="radio" name="shape" data-shape="line" /><span>Лінія</span></label>
          <label><input type="radio" name="shape" data-shape="rect" /><span>Прямокутник</span></label>
          <label><input type="radio" name="shape" data-shape="ellipse" /><span>Еліпс</span></label>
        </div>
      </details>
      <details>
        <summary>Довідка</summary>
        <div class="menu"><button type="button" id="about">Про програму</button></div>
      </details>
    </nav>
    <div id="toolbar">
      <button type="button" data-shape="point" title="Крапка" aria-label="Крапка" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2" fill="currentColor" /></svg></button>
      <button type="button" data-shape="line" title="Лінія" aria-label="Лінія" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 20 4" /></svg></button>
      <button type="button" data-shape="rect" title="Прямокутник" aria-label="Прямокутник" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" /></svg></button>
      <button type="button" data-shape="ellipse" title="Еліпс" aria-label="Еліпс" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="6" /></svg></button>
    </div>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
